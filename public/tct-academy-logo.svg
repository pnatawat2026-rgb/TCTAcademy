<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <!-- 3D Metallic Carmine Red Gradients -->
    <linearGradient id="tctRedBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3843" />
      <stop offset="25%" stop-color="#E8000B" />
      <stop offset="60%" stop-color="#C20008" />
      <stop offset="85%" stop-color="#940005" />
      <stop offset="100%" stop-color="#5E0003" />
    </linearGradient>

    <!-- Glossy Specular Reflection Gradient (Upper Lens) -->
    <linearGradient id="tctGlossLens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FFB3B8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#E6000B" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#730004" stop-opacity="0.6" />
    </linearGradient>

    <!-- Chrome Edge Bevel Gradient -->
    <linearGradient id="tctBevelGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#470002" />
      <stop offset="30%" stop-color="#B80008" />
      <stop offset="70%" stop-color="#FF525C" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Deep Shadow Filter -->
    <filter id="tctShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Inner Edge Clip for Upper Glass Sheen -->
    <clipPath id="upperHalfClip">
      <rect x="0" y="0" width="960" height="195" />
    </clipPath>
  </defs>

  <g filter="url(#tctShadow)">
    <!-- 3D EXTRUDED METALLIC LETTERS "T C T" -->
    <!-- Overall Italic Skew -->
    <g transform="skewX(-16) translate(140, 20)">

      <!-- ================= LETTER 1: LEFT "T" ================= -->
      <!-- Shadow/Bevel Depth -->
      <path 
        d="M 40,75 L 235,75 Q 248,75 244,92 L 232,135 Q 228,145 218,145 L 175,145 L 132,275 Q 128,290 110,290 L 52,290 Q 38,290 42,275 L 85,145 L 45,145 Q 32,145 36,132 L 48,90 Q 52,75 40,75 Z" 
        fill="#3D0002" 
        transform="translate(4, 8)"
      />
      <!-- Main Face -->
      <path 
        d="M 40,75 L 235,75 Q 248,75 244,92 L 232,135 Q 228,145 218,145 L 175,145 L 132,275 Q 128,290 110,290 L 52,290 Q 38,290 42,275 L 85,145 L 45,145 Q 32,145 36,132 L 48,90 Q 52,75 40,75 Z" 
        fill="url(#tctRedBase)" 
        stroke="url(#tctBevelGlow)" 
        stroke-width="2.5" 
      />
      <!-- Glossy Reflection Overlay -->
      <path 
        d="M 40,75 L 235,75 Q 248,75 244,92 L 232,135 Q 228,145 218,145 L 175,145 L 132,275 Q 128,290 110,290 L 52,290 Q 38,290 42,275 L 85,145 L 45,145 Q 32,145 36,132 L 48,90 Q 52,75 40,75 Z" 
        fill="url(#tctGlossLens)" 
      />
      <!-- Sharp Glass Horizon Line Highlight -->
      <path 
        d="M 46,78 L 235,78 L 228,110 Q 140,115 50,110 Z" 
        fill="#FFFFFF" 
        opacity="0.55" 
      />
      <!-- Top Edge Specular Rim -->
      <path 
        d="M 42,76 L 234,76" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        opacity="0.85" 
      />

      <!-- ================= LETTER 2: CENTER "C" ================= -->
      <!-- Shadow/Bevel Depth -->
      <path 
        d="M 410,75 L 275,75 Q 185,75 160,150 Q 135,225 225,285 Q 255,290 325,290 L 400,290 Q 412,290 410,275 L 398,235 Q 395,220 380,220 L 305,220 Q 240,220 252,185 Q 265,145 330,145 L 395,145 Q 410,145 408,132 L 418,90 Q 420,75 410,75 Z" 
        fill="#3D0002" 
        transform="translate(4, 8)"
      />
      <!-- Main Face -->
      <path 
        d="M 410,75 L 275,75 Q 185,75 160,150 Q 135,225 225,285 Q 255,290 325,290 L 400,290 Q 412,290 410,275 L 398,235 Q 395,220 380,220 L 305,220 Q 240,220 252,185 Q 265,145 330,145 L 395,145 Q 410,145 408,132 L 418,90 Q 420,75 410,75 Z" 
        fill="url(#tctRedBase)" 
        stroke="url(#tctBevelGlow)" 
        stroke-width="2.5" 
      />
      <!-- Glossy Reflection Overlay -->
      <path 
        d="M 410,75 L 275,75 Q 185,75 160,150 Q 135,225 225,285 Q 255,290 325,290 L 400,290 Q 412,290 410,275 L 398,235 Q 395,220 380,220 L 305,220 Q 240,220 252,185 Q 265,145 330,145 L 395,145 Q 410,145 408,132 L 418,90 Q 420,75 410,75 Z" 
        fill="url(#tctGlossLens)" 
      />
      <!-- Sharp Glass Horizon Line Highlight -->
      <path 
        d="M 408,78 L 275,78 Q 200,82 175,130 L 195,140 Q 215,95 285,92 L 400,92 Z" 
        fill="#FFFFFF" 
        opacity="0.55" 
      />
      <!-- Top Edge Specular Rim -->
      <path 
        d="M 276,76 L 408,76" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        opacity="0.85" 
      />

      <!-- ================= LETTER 3: RIGHT "T" ================= -->
      <!-- Shadow/Bevel Depth -->
      <path 
        d="M 435,75 L 630,75 Q 643,75 639,92 L 627,135 Q 623,145 613,145 L 570,145 L 527,275 Q 523,290 505,290 L 447,290 Q 433,290 437,275 L 480,145 L 440,145 Q 427,145 431,132 L 443,90 Q 447,75 435,75 Z" 
        fill="#3D0002" 
        transform="translate(4, 8)"
      />
      <!-- Main Face -->
      <path 
        d="M 435,75 L 630,75 Q 643,75 639,92 L 627,135 Q 623,145 613,145 L 570,145 L 527,275 Q 523,290 505,290 L 447,290 Q 433,290 437,275 L 480,145 L 440,145 Q 427,145 431,132 L 443,90 Q 447,75 435,75 Z" 
        fill="url(#tctRedBase)" 
        stroke="url(#tctBevelGlow)" 
        stroke-width="2.5" 
      />
      <!-- Glossy Reflection Overlay -->
      <path 
        d="M 435,75 L 630,75 Q 643,75 639,92 L 627,135 Q 623,145 613,145 L 570,145 L 527,275 Q 523,290 505,290 L 447,290 Q 433,290 437,275 L 480,145 L 440,145 Q 427,145 431,132 L 443,90 Q 447,75 435,75 Z" 
        fill="url(#tctGlossLens)" 
      />
      <!-- Sharp Glass Horizon Line Highlight -->
      <path 
        d="M 441,78 L 630,78 L 623,110 Q 535,115 445,110 Z" 
        fill="#FFFFFF" 
        opacity="0.55" 
      />
      <!-- Top Edge Specular Rim -->
      <path 
        d="M 437,76 L 629,76" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        opacity="0.85" 
      />
    </g>

    <!-- ================= AERODYNAMIC UNITING BAR ================= -->
    <g transform="skewX(-16) translate(140, 20)">
      <!-- Dynamic Speed Bar with Bevel -->
      <path 
        d="M 50,302 L 620,302 L 600,314 L 30,314 Z" 
        fill="url(#tctRedBase)" 
        stroke="url(#tctBevelGlow)" 
        stroke-width="1.5" 
      />
      <!-- Top Chrome Highlight -->
      <path 
        d="M 52,303 L 618,303" 
        stroke="#FFFFFF" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.9" 
      />
    </g>

    <!-- ================= TYPOGRAPHY UNDERNEATH ================= -->
    <!-- Line 1: TEIJIN CORD Academy (Italic Bold Red) -->
    <text 
      x="480" 
      y="382" 
      text-anchor="middle" 
      font-family="'Chakra Petch', 'Arial Black', Arial, sans-serif" 
      font-weight="900" 
      font-style="italic" 
      font-size="52" 
      letter-spacing="2" 
      fill="#C00008"
    >
      TEIJIN CORD <tspan font-weight="700" fill="#9E0006">Academy</tspan>
    </text>

    <!-- Line 2: Human Resources Development and Training Center (Italic Dark Slate) -->
    <text 
      x="480" 
      y="435" 
      text-anchor="middle" 
      font-family="'Sarabun', 'Segoe UI', Arial, sans-serif" 
      font-weight="700" 
      font-style="italic" 
      font-size="30" 
      letter-spacing="1.2" 
      fill="#383838"
    >
      Human Resources Development and Training Center
    </text>
  </g>
</svg>
