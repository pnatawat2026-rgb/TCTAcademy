<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- 3D Metallic Carmine Red Gradient -->
    <linearGradient id="favRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3843" />
      <stop offset="35%" stop-color="#E8000B" />
      <stop offset="70%" stop-color="#C20008" />
      <stop offset="100%" stop-color="#730004" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="favGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF525C" stop-opacity="0" />
    </linearGradient>

    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#001833" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Clean Rounded Tile for crisp visibility on all tab themes (Light & Dark) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#favShadow)" />

  <!-- Bold TCT Lettering scaled for 64x64 or 32x32 favicon readability -->
  <g transform="translate(32, 28) scale(0.09) translate(-480, -180)">
    <g transform="skewX(-16) translate(140, 20)">
      <!-- T -->
      <path d="M 40,75 L 235,75 Q 248,75 244,92 L 232,135 Q 228,145 218,145 L 175,145 L 132,275 Q 128,290 110,290 L 52,290 Q 38,290 42,275 L 85,145 L 45,145 Q 32,145 36,132 L 48,90 Q 52,75 40,75 Z" fill="url(#favRed)" />
      <!-- C -->
      <path d="M 410,75 L 275,75 Q 185,75 160,150 Q 135,225 225,285 Q 255,290 325,290 L 400,290 Q 412,290 410,275 L 398,235 Q 395,220 380,220 L 305,220 Q 240,220 252,185 Q 265,145 330,145 L 395,145 Q 410,145 408,132 L 418,90 Q 420,75 410,75 Z" fill="url(#favRed)" />
      <!-- T -->
      <path d="M 435,75 L 630,75 Q 643,75 639,92 L 627,135 Q 623,145 613,145 L 570,145 L 527,275 Q 523,290 505,290 L 447,290 Q 433,290 437,275 L 480,145 L 440,145 Q 427,145 431,132 L 443,90 Q 447,75 435,75 Z" fill="url(#favRed)" />
      <!-- Bar -->
      <path d="M 50,302 L 620,302 L 600,314 L 30,314 Z" fill="url(#favRed)" />
    </g>
  </g>

  <!-- Mini Tag: E-TRAIN -->
  <text 
    x="32" 
    y="54" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="8.5" 
    letter-spacing="0.5" 
    fill="#002855"
  >
    TRAINING
  </text>
</svg>
