<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Card Subtle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Outer App Tile Drop Shadow -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#001833" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001833" flood-opacity="0.08" />
    </filter>

    <!-- 3D Metallic Carmine Red Gradients -->
    <linearGradient id="tctRedBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3843" />
      <stop offset="25%" stop-color="#E8000B" />
      <stop offset="60%" stop-color="#C20008" />
      <stop offset="85%" stop-color="#940005" />
      <stop offset="100%" stop-color="#5E0003" />
    </linearGradient>

    <!-- Glossy Specular Reflection Gradient (Upper Lens) -->
    <linearGradient id="tctGlossLens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FFB3B8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#E6000B" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#730004" stop-opacity="0.6" />
    </linearGradient>

    <!-- Chrome Edge Bevel Gradient -->
    <linearGradient id="tctBevelGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#470002" />
      <stop offset="30%" stop-color="#B80008" />
      <stop offset="70%" stop-color="#FF525C" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Emblem Shadow Filter -->
    <filter id="tctShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Desktop App Icon Base Tile (Squircle with sleek border & subtle depth) -->
  <rect 
    x="16" 
    y="16" 
    width="480" 
    height="480" 
    rx="108" 
    fill="url(#bgGrad)" 
    stroke="#E2E8F0" 
    stroke-width="3" 
    filter="url(#tileShadow)"
  />

  <!-- Subtle Inner Top Bevel Rim for Premium Native App Feel -->
  <rect 
    x="18" 
    y="18" 
    width="476" 
    height="238" 
    rx="106" 
    fill="#FFFFFF" 
    opacity="0.5"
  />

  <!-- Emblem Content Scaled and Centered -->
  <!-- Original emblem width is ~600px, height ~320px in 960x480 space -->
  <g transform="translate(256, 195) scale(0.68) translate(-480, -210)" filter="url(#tctShadow)">
    <!-- 3D EXTRUDED METALLIC LETTERS "T C T" -->
    <g transform="skewX(-16) translate(140, 20)">

      <!-- LETTER 1: LEFT "T" -->
      <path 
        d="M 40,75 L 235,75 Q 248,75 244,92 L 232,135 Q 228,145 218,145 L 175,145 L 132,275 Q 128,290 110,290 L 52,290 Q 38,290 42,275 L 85,145 L 45,145 Q 32,145 36,132 L 48,90 Q 52,75 40,75 Z" 
        fill="#3D0002" 
        transform="translate(4, 8)"
      />
      <path 
        d="M 40,75 L 235,75 Q 248,75 244,92 L 232,135 Q 228,145 218,145 L 175,145 L 132,275 Q 128,290 110,290 L 52,290 Q 38,290 42,275 L 85,145 L 45,145 Q 32,145 36,132 L 48,90 Q 52,75 40,75 Z" 
        fill="url(#tctRedBase)" 
        stroke="url(#tctBevelGlow)" 
        stroke-width="2.5" 
      />
      <path 
        d="M 40,75 L 235,75 Q 248,75 244,92 L 232,135 Q 228,145 218,145 L 175,145 L 132,275 Q 128,290 110,290 L 52,290 Q 38,290 42,275 L 85,145 L 45,145 Q 32,145 36,132 L 48,90 Q 52,75 40,75 Z" 
        fill="url(#tctGlossLens)" 
      />
      <path 
        d="M 46,78 L 235,78 L 228,110 Q 140,115 50,110 Z" 
        fill="#FFFFFF" 
        opacity="0.55" 
      />
      <path 
        d="M 42,76 L 234,76" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        opacity="0.85" 
      />

      <!-- LETTER 2: CENTER "C" -->
      <path 
        d="M 410,75 L 275,75 Q 185,75 160,150 Q 135,225 225,285 Q 255,290 325,290 L 400,290 Q 412,290 410,275 L 398,235 Q 395,220 380,220 L 305,220 Q 240,220 252,185 Q 265,145 330,145 L 395,145 Q 410,145 408,132 L 418,90 Q 420,75 410,75 Z" 
        fill="#3D0002" 
        transform="translate(4, 8)"
      />
      <path 
        d="M 410,75 L 275,75 Q 185,75 160,150 Q 135,225 225,285 Q 255,290 325,290 L 400,290 Q 412,290 410,275 L 398,235 Q 395,220 380,220 L 305,220 Q 240,220 252,185 Q 265,145 330,145 L 395,145 Q 410,145 408,132 L 418,90 Q 420,75 410,75 Z" 
        fill="url(#tctRedBase)" 
        stroke="url(#tctBevelGlow)" 
        stroke-width="2.5" 
      />
      <path 
        d="M 410,75 L 275,75 Q 185,75 160,150 Q 135,225 225,285 Q 255,290 325,290 L 400,290 Q 412,290 410,275 L 398,235 Q 395,220 380,220 L 305,220 Q 240,220 252,185 Q 265,145 330,145 L 395,145 Q 410,145 408,132 L 418,90 Q 420,75 410,75 Z" 
        fill="url(#tctGlossLens)" 
      />
      <path 
        d="M 408,78 L 275,78 Q 200,82 175,130 L 195,140 Q 215,95 285,92 L 400,92 Z" 
        fill="#FFFFFF" 
        opacity="0.55" 
      />
      <path 
        d="M 276,76 L 408,76" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        opacity="0.85" 
      />

      <!-- LETTER 3: RIGHT "T" -->
      <path 
        d="M 435,75 L 630,75 Q 643,75 639,92 L 627,135 Q 623,145 613,145 L 570,145 L 527,275 Q 523,290 505,290 L 447,290 Q 433,290 437,275 L 480,145 L 440,145 Q 427,145 431,132 L 443,90 Q 447,75 435,75 Z" 
        fill="#3D0002" 
        transform="translate(4, 8)"
      />
      <path 
        d="M 435,75 L 630,75 Q 643,75 639,92 L 627,135 Q 623,145 613,145 L 570,145 L 527,275 Q 523,290 505,290 L 447,290 Q 433,290 437,275 L 480,145 L 440,145 Q 427,145 431,132 L 443,90 Q 447,75 435,75 Z" 
        fill="url(#tctRedBase)" 
        stroke="url(#tctBevelGlow)" 
        stroke-width="2.5" 
      />
      <path 
        d="M 435,75 L 630,75 Q 643,75 639,92 L 627,135 Q 623,145 613,145 L 570,145 L 527,275 Q 523,290 505,290 L 447,290 Q 433,290 437,275 L 480,145 L 440,145 Q 427,145 431,132 L 443,90 Q 447,75 435,75 Z" 
        fill="url(#tctGlossLens)" 
      />
      <path 
        d="M 441,78 L 630,78 L 623,110 Q 535,115 445,110 Z" 
        fill="#FFFFFF" 
        opacity="0.55" 
      />
      <path 
        d="M 437,76 L 629,76" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        opacity="0.85" 
      />
    </g>

    <!-- AERODYNAMIC UNITING SPEED BAR -->
    <g transform="skewX(-16) translate(140, 20)">
      <path 
        d="M 50,302 L 620,302 L 600,314 L 30,314 Z" 
        fill="url(#tctRedBase)" 
        stroke="url(#tctBevelGlow)" 
        stroke-width="1.5" 
      />
      <path 
        d="M 52,303 L 618,303" 
        stroke="#FFFFFF" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.9" 
      />
    </g>
  </g>

  <!-- Typography Label Line 1: TEIJIN CORD Academy -->
  <text 
    x="256" 
    y="360" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-style="italic" 
    font-size="34" 
    letter-spacing="1" 
    fill="#C00008"
  >
    TEIJIN CORD <tspan font-weight="700" fill="#9E0006">Academy</tspan>
  </text>

  <!-- Badge / Pill: E-TRAINING -->
  <g transform="translate(256, 412)">
    <rect 
      x="-110" 
      y="-22" 
      width="220" 
      height="44" 
      rx="22" 
      fill="#002855" 
    />
    <text 
      x="0" 
      y="8" 
      text-anchor="middle" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-weight="900" 
      font-size="22" 
      letter-spacing="2.5" 
      fill="#FFFFFF"
    >
      E-TRAINING
    </text>
  </g>
</svg>
